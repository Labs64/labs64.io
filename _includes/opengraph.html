<!-- OpenGraph -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"/>
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %} | {{ site.title }}"/>
<meta property="og:site_name" content="{{ site.title }}"/>
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"/>
<meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}"/>
<meta property="og:image" content="{{ l64_og_image }}"/>
<meta property="og:image:alt" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title }}{% endif %}"/>
{% if l64_og_card %}<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>{% endif %}
<meta property="og:locale" content="en_US"/>
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}"/>
<meta property="article:author" content="{% if page.author.name %}{{ page.author.name }}{% else %}{{ site.title }}{% endif %}"/>
{% endif %}
