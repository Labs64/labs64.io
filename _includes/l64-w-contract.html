{%- comment -%} Zig-zag widget: one OpenAPI contract, three kinds of consumers. {%- endcomment -%}
<div class="L64M"><div class="L64M_wd" data-l64-contract>
  <div class="L64M_wd_hd"><b>One contract, every stack</b><span class="L64M_badge">illustrative</span></div>
  <pre class="L64M_code L64M_code--sm" data-hl><code>paths:
  /events:
    post:
      operationId: publishEvent</code></pre>
  <div class="L64M_pulse" aria-hidden="true"><i></i></div>
  <div class="L64M_sub" role="tablist" aria-label="Generated from the contract">
    <button type="button" role="tab" aria-selected="true" data-k="java">Java</button>
    <button type="button" role="tab" aria-selected="false" data-k="py">Python</button>
    <button type="button" role="tab" aria-selected="false" data-k="vue">Vue 3</button>
  </div>
  <div class="L64M_gen" data-gen aria-live="polite"></div>
</div></div>
