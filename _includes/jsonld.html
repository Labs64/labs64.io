{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": "{{ page.url | prepend: site.baseurl | prepend: site.url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  {% if page.image.url %}"image": "{{ page.image.url | prepend: site.baseurl | prepend: site.url }}",{% endif %}
  "author": {
    "@type": "{% if page.author.url %}Organization{% else %}Person{% endif %}",
    "name": "{% if page.author.name %}{{ page.author.name }}{% else %}{{ site.title }}{% endif %}"{% if page.author.url %},
    "url": "{{ page.author.url }}"{% endif %}
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ '/img/labs64-avatar-30x30.png' | prepend: site.baseurl | prepend: site.url }}"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | prepend: site.baseurl | prepend: site.url }}"
  }
}
</script>
{% elsif page.url == '/' or page.url == '/index.html' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.title }}",
  "url": "{{ '/' | prepend: site.baseurl | prepend: site.url }}",
  "logo": "{{ '/img/labs64-logo.png' | prepend: site.baseurl | prepend: site.url }}",
  "description": "{{ site.description }}"
}
</script>
{% elsif page.url contains '/products/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{ page.title }}",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "All",
  "description": "{{ page.description }}",
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}"
  }
}
</script>
{% elsif page.url == '/pricing/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Can I mix Open Source and Enterprise modules?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can start with the Community edition and upgrade specific modules to Enterprise licenses as your compliance or support requirements evolve."
      }
    },
    {
      "@type": "Question",
      "name": "What is the \"Managed SaaS option\"?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Instead of self-hosting, our expert team can deploy, manage, and scale the Labs64.IO ecosystem for you in a dedicated, secure cloud environment."
      }
    }
  ]
}
</script>
{% endif %}
