{%- comment -%} Pick a brand colour and watch a sample checkout follow it. Sample data, not real customers. {%- endcomment -%}
<div class="L64M"><div class="L64M_wl" data-l64-theme>
  <div class="L64M_wl_txt">
    <div class="L64M_sw" role="group" aria-label="Brand colour">
      <button type="button" style="--c:#C23A0E" aria-pressed="true" aria-label="Ember" data-a="#C23A0E" data-b="#FFE9DD" data-t="#7B2A10"></button>
      <button type="button" style="--c:#2F6BFF" aria-pressed="false" aria-label="Blue" data-a="#2F6BFF" data-b="#E5EDFF" data-t="#1B3FA3"></button>
      <button type="button" style="--c:#0F7D58" aria-pressed="false" aria-label="Green" data-a="#0F7D58" data-b="#DDF6EC" data-t="#0B5C41"></button>
      <button type="button" style="--c:#7A3FF0" aria-pressed="false" aria-label="Violet" data-a="#7A3FF0" data-b="#EDE3FF" data-t="#5427B0"></button>
    </div>
    <p class="L64M_cap">Demo brand colours, not real customers.</p>
  </div>
  <div class="L64M_wl_card" data-theme-preview role="img" aria-label="Sample whitelabel checkout card">
    <h4><i></i>Checkout</h4>
    <div class="ln"><span>Team plan</span><b>EUR 49.00</b></div>
    <div class="ln"><span>Shipping</span><b>Included</b></div>
    <div class="pay"><span class="on">Card</span><span>PayPal</span></div>
    <span class="cta">Pay now</span>
  </div>
</div></div>
