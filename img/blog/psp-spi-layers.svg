<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spi-title spi-desc" id="psp-spi-layers-root">
<title id="spi-title">Payment Gateway provider SPI layers</title>
<desc id="spi-desc">The gateway core owns the provider registry, tenant configuration, state and events. The provider SPI has one required interface, PaymentProvider, and three optional capabilities. The noop, Stripe and PayPal modules implement it and talk to their PSP APIs.</desc>
<defs>
