<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hop-title hop-desc" id="internal-call-before-after-root">
<title id="hop-title">Service-to-service call before and after</title>
<desc id="hop-desc">Before, the Payment Gateway fetched a Keycloak token and sent each audit event through the Traefik gateway. After, it calls the AuditFlow Kubernetes service directly with trusted X-Auth headers for the svc:payment-gateway principal, protected by a NetworkPolicy.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #internal-call-before-after-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #internal-call-before-after-root .c { width:100%;overflow-x:auto }</style>
<marker id="internal-call-before-after-hop-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="internal-call-before-after-hop-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="internal-call-before-after-hop-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="452" fill="#F9F9F9"/>
