y="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">BEARER</text><line x1="454" y1="148" x2="576" y2="148" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#internal-call-before-after-hop-a)"/><rect x="488" y="127" width="54" height="14" rx="2" fill="#F9F9F9"/><text x="515" y="138" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text><line x1="174" y1="324" x2="576" y2="324" stroke="#E14817" stroke-width="1.2" marker-end="url(#internal-call-before-after-hop-ac)"/><rect x="333" y="303" width="84" height="14" rx="2" fill="#F9F9F9"/><text x="375" y="314" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SVC X-AUTH-*</text><rect x="24" y="84" width="150" height="56" rx="6" fill="#F9F9F9"/><rect x="24" y="84" width="150" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="99.0" y="111.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Payment Gateway</text><text x="99.0" y="127.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">OAuth client</text><rect x="304" y="40" width="150" height="48" rx="6" fill="#F9F9F9"/><rect x="304" y="40" width="150" height="48" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="379.0" y="69.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Keycloak</text><rect x="304" y="124" width="150" height="48" rx="6" fill="#F9F9F9"/><rect x="304" y="124" width="150" height="48" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="379.0" y="153.0" fill="#33333