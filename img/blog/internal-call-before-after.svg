" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="430" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Sets svc:payment-gateway</text><rect x="308.6" y="419" width="22" height="14" rx="3" fill="#333333" stroke="rgba(51,51,51,0.45)" fill-opacity="0.03"/><text x="341.6" y="430" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Removed from the path</text><line x1="493.5" y1="426" x2="521.5" y2="426" stroke="#E14817" stroke-width="1.2" marker-end="url(#internal-call-before-after-hop-ac)"/><text x="529.5" y="430" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Direct in-cluster call</text>
