<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc" id="fastapi-event-loop-timeline-root">
<title id="loop-title">Blocking work in async def versus def</title>
<desc id="loop-desc">With async def, a five-second blocking /auth call holds the event loop, /health waits past the probe timeout and the pod is restarted. With def, /auth runs on a worker thread and /health answers in about 2 ms.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fastapi-event-loop-timeline-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #fastapi-event-loop-timeline-root .c { width:100%;overflow-x:auto }</style>
<marker id="fastapi-event-loop-timeline-loop-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="fastapi-event-loop-timeline-loop-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="fastapi-event-loop-timeline-loop-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
