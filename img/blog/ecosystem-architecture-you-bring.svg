<title id="bring-title">What you bring to a Labs64.IO deployment</title>
<desc id="bring-desc">Module charts run on your Kubernetes cluster and connect to PostgreSQL, a Redis-compatible store, a message broker, an OIDC provider and DNS with TLS that you provide.</desc>
