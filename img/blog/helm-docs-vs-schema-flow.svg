<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 304" width="800" height="304" role="img" aria-labelledby="helm-docs-schema-title helm-docs-schema-desc"><title id="helm-docs-schema-title">One values file, two artifacts</title><desc id="helm-docs-schema-desc">helm-docs writes README.md for people and a schema generator writes values.schema.json for Helm, both from values.yaml comments.</desc><defs><marker id="helm-docs-schema-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="helm-docs-schema-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="helm-docs-schema-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="304" fill="#F9F9F9"/><path d="M200,152 L236.0,152.0 Q244,152 244.0,144.0 L244.0,104.0 Q244,96 252.0,96.0 L288,96" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-docs-schema-ah-def)"/><path d="M200,168 L236.0,168.0 Q244,168 244.0,176.0 L244.0,200.0 Q244,208 252.0,208.0 L288,208" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-docs-schema-ah-def)"/><path d="M488,96 L576,96" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-docs-schema-ah-def)"/><path d="M488,208 L576,208" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-docs-schema-ah-def)"/><rect x="24" y="120" width="176" height="64" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="112.0" y="149.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">values.yaml</text><text x="112.0" y="166.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle"># -- and @schema comments</text><rect x="288" y="72" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="388.0" y="93.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">helm-docs</text><text x="388.0" y="110.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">norwoodj/helm-docs</text><rect x="288" y="184" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="388.0" y="205.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Schema generator</text><text x="388.0" y="222.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">dadav or losisin tool</text><rect x="576" y="72" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="676.0" y="93.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">README.md</text><text x="676.0" y="110.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">for people</text><rect x="576" y="184" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="676.0" y="205.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">values.schema.json</text><text x="676.0" y="222.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">enforced by Helm</text><text x="24" y="276" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">Both schema tools can read helm-docs '# --' comments, so each description is written once.</text></svg>