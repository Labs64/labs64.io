<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-labelledby="helm-validate-title helm-validate-desc"><title id="helm-validate-title">Where Helm checks your values</title><desc id="helm-validate-desc">Chart defaults, -f files and --set overrides merge into one values object that Helm validates against values.schema.json before rendering templates.</desc><defs><marker id="helm-validate-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="helm-validate-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="helm-validate-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="368" fill="#F9F9F9"/><path d="M192,128 L256,128" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M192,176 L256,176" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M192,224 L256,224" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M400,176 L464,176" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M608,160 L632.0,160.0 Q640,160 640.0,152.0 L640.0,128.0 Q640,120 648.0,120.0 L672,120" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M608,192 L632.0,192.0 Q640,192 640.0,200.0 L640.0,224.0 Q640,232 648.0,232.0 L672,232" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#helm-validate-ah-def)"/><path d="M536,296 L536,224" fill="none" stroke="#853E29" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#helm-validate-ah-link)"/><rect x="256" y="80" width="144" height="192" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="328.0" y="173.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Merged values</text><text x="328.0" y="190.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">one object</text><rect x="24" y="108" width="168" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="108.0" y="132.5" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">values.yaml</text><rect x="24" y="156" width="168" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="108.0" y="180.5" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">-f env.yaml</text><rect x="24" y="204" width="168" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="108.0" y="228.5" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">--set key=value</text><rect x="464" y="128" width="144" height="96" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="536.0" y="173.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Validate</text><text x="536.0" y="190.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">values.schema.json</text><rect x="672" y="96" width="104" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="724.0" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Render</text><text x="724.0" y="134.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">templates</text><rect x="672" y="208" width="104" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="724.0" y="229.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Stop</text><text x="724.0" y="246.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">with error</text><rect x="436" y="296" width="200" height="40" rx="6" fill="#EFEBE7" stroke="#6B6B6B" stroke-width="1.25" stroke-dasharray="5,4"/><text x="536.0" y="320.5" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">--skip-schema-validation</text><rect x="544.0" y="253.0" width="78.4" height="16" fill="#F9F9F9"/><text x="548.0" y="264.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#853E29" text-anchor="start">BREAK-GLASS</text><text x="24" y="360" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">Checked by helm lint, helm template and helm install; tested on Helm 4.3.2.</text></svg>