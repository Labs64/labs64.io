<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-title schema-desc" id="self-describing-schemas-root">
<title id="schema-title">Self-describing API responses</title>
<desc id="schema-desc">The OpenAPI spec generates both the server models and, through OpenApiSchemaGeneratorCli, the published JSON Schema files. Every API response object carries a $schema URI that points to the versioned schema describing it.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #self-describing-schemas-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #self-describing-schemas-root .c { width:100%;overflow-x:auto }</style>
<marker id="self-describing-schemas-schema-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="self-describing-schemas-schema-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="self-describing-schemas-schema-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
