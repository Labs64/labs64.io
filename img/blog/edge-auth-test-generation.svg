<svg viewBox="0 0 760 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edge-title edge-desc" id="edge-auth-test-generation-root">
<title id="edge-title">One contract, three outputs</title>
<desc id="edge-desc">The x-labs64.auth annotation in each OpenAPI contract generates the Cerbos policies, the gateway routes and the auth_enforcement.robot suite. The generated tests call every protected operation at the edge without a token and expect 401 or 403.</desc>
