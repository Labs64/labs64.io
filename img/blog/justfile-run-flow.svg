<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-labelledby="justfile-flow-title justfile-flow-desc"><title id="justfile-flow-title">What happens when you run a just recipe</title><desc id="justfile-flow-desc">just reads the justfile and .env, runs dependencies first, then the recipe body in the configured shell.</desc><defs><marker id="justfile-flow-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="justfile-flow-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="justfile-flow-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="376" fill="#F9F9F9"/><rect x="24" y="156" width="752" height="180" rx="8" fill="none" stroke="#D9D4CF" stroke-width="1.25" stroke-dasharray="6,5"/><text x="36" y="174" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.08em" fill="#6B6B6B">WHICH SHELL RUNS EACH LINE?</text><path d="M176,64 L224,64" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#justfile-flow-ah-def)"/><path d="M376,64 L424,64" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#justfile-flow-ah-def)"/><path d="M576,64 L624,64" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#justfile-flow-ah-def)"/><path d="M700,88 L700,156" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#justfile-flow-ah-def)"/><rect x="24" y="40" width="152" height="48" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="100.0" y="68.5" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#333333" text-anchor="middle">just build release</text><rect x="224" y="40" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="300.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Read justfile</text><text x="300.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">plus .env if enabled</text><rect x="424" y="40" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="500.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Run dependency</text><text x="500.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">clean</text><rect x="624" y="40" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="700.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Run recipe body</text><text x="700.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">build mode=release</text><rect x="48" y="200" width="216" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="156.0" y="229.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">macOS and Linux</text><text x="156.0" y="246.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">default: sh -cu</text><rect x="292" y="200" width="216" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="400.0" y="229.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Windows with sh on PATH</text><text x="400.0" y="246.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">Git for Windows, Cygwin</text><rect x="536" y="200" width="216" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="644.0" y="229.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Windows with PowerShell</text><text x="644.0" y="246.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">[windows] set shell := [...]</text><rect x="652.0" y="115.0" width="40.0" height="16" fill="#F9F9F9"/><text x="688.0" y="126.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="end">SHELL</text><text x="48" y="308" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">A recipe starting with #! (a shebang) runs as one script in its own interpreter.</text></svg>