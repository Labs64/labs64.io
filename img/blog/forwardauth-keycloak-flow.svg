<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-labelledby="forwardauth-flow-title forwardauth-flow-desc"><title id="forwardauth-flow-title">forwardAuth with Keycloak</title><desc id="forwardauth-flow-desc">Traefik asks an auth service about each request; the auth service verifies the JWT with cached Keycloak keys and answers 2XX with identity headers or an error.</desc><defs><marker id="forwardauth-flow-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="forwardauth-flow-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="forwardauth-flow-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="368" fill="#F9F9F9"/><path d="M400,128 L400,72" fill="none" stroke="#853E29" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#forwardauth-flow-ah-link)"/><path d="M376,248 L376,184" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#forwardauth-flow-ah-def)"/><path d="M424,184 L424,248" fill="none" stroke="#853E29" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#forwardauth-flow-ah-link)"/><path d="M176,276 L312,276" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#forwardauth-flow-ah-def)"/><path d="M488,276 L624,276" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#forwardauth-flow-ah-def)"/><rect x="312" y="24" width="176" height="48" rx="6" fill="#EFEBE7" stroke="#6B6B6B" stroke-width="1.25" stroke-dasharray="5,4"/><text x="400.0" y="45.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Keycloak</text><text x="400.0" y="62.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">realm /certs endpoint</text><rect x="312" y="128" width="176" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="400.0" y="153.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Auth service</text><text x="400.0" y="170.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">verifies the JWT</text><rect x="312" y="248" width="176" height="56" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="400.0" y="273.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Traefik</text><text x="400.0" y="290.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">forwardAuth middleware</text><rect x="24" y="252" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="100.0" y="273.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Client</text><text x="100.0" y="290.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">request + bearer JWT</text><rect x="624" y="252" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="700.0" y="273.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Backend</text><text x="700.0" y="290.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">X-Auth-* headers</text><rect x="408.0" y="93.0" width="84.8" height="16" fill="#F9F9F9"/><text x="412.0" y="104.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#853E29" text-anchor="start">KEYS, CACHED</text><rect x="340.8" y="209.0" width="27.2" height="16" fill="#F9F9F9"/><text x="364.0" y="220.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="end">ASK</text><rect x="432.0" y="209.0" width="91.2" height="16" fill="#F9F9F9"/><text x="436.0" y="220.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#853E29" text-anchor="start">2XX + HEADERS</text><rect x="208.0" y="254.0" width="72.0" height="16" fill="#F9F9F9"/><text x="244.0" y="265.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="middle">BEARER JWT</text><rect x="529.6" y="254.0" width="52.8" height="16" fill="#F9F9F9"/><text x="556.0" y="265.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="middle">FORWARD</text><text x="24" y="348" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">A 401 or 403 from the auth service is returned to the client instead of forwarding.</text></svg>