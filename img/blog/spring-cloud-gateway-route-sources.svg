<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-labelledby="route-sources-title route-sources-desc"><title id="route-sources-title">Where Spring Cloud Gateway routes come from</title><desc id="route-sources-desc">Properties and a repository feed RouteDefinitionLocators, which build routes; RouteLocatorBuilder beans add routes in Java; a caching RouteLocator holds them until a RefreshRoutesEvent.</desc><defs><marker id="route-sources-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="route-sources-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="route-sources-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="456" fill="#F9F9F9"/><path d="M200,88 L224.0,88.0 Q232,88 232.0,96.0 L232.0,120.0 Q232,128 240.0,128.0 L264,128" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#route-sources-ah-def)"/><path d="M200,184 L224.0,184.0 Q232,184 232.0,176.0 L232.0,168.0 Q232,160 240.0,160.0 L264,160" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#route-sources-ah-def)"/><path d="M440,144 L504,144" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#route-sources-ah-def)"/><path d="M640,184 L640,344" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#route-sources-ah-def)"/><path d="M440,288 L464.0,288.0 Q472,288 472.0,296.0 L472.0,368.0 Q472,376 480.0,376.0 L504,376" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#route-sources-ah-def)"/><rect x="24" y="64" width="176" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="112.0" y="85.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">YAML / properties</text><text x="112.0" y="102.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">server.webflux.routes</text><rect x="24" y="160" width="176" height="48" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="112.0" y="181.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Your repository</text><text x="112.0" y="198.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">RouteDefinitionRepository</text><rect x="264" y="96" width="176" height="96" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="352.0" y="141.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">RouteDefinitionLocator</text><text x="352.0" y="158.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">supplies RouteDefinitions</text><rect x="504" y="104" width="272" height="80" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="640.0" y="141.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">RouteDefinitionRouteLocator</text><text x="640.0" y="158.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">turns definitions into Routes</text><rect x="264" y="264" width="176" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="352.0" y="285.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">RouteLocatorBuilder</text><text x="352.0" y="302.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">Java: builder.routes()</text><rect x="504" y="344" width="272" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="640.0" y="373.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">CachingRouteLocator</text><text x="640.0" y="390.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">cache cleared by RefreshRoutesEvent</text><rect x="648.0" y="257.0" width="46.4" height="16" fill="#F9F9F9"/><text x="652.0" y="268.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="start">ROUTES</text><text x="24" y="440" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">Requests are matched against the cached routes, in order.</text></svg>