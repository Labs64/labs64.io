<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idem-title idem-desc" id="idempotency-redis-states-root">
<title id="idem-title">Idempotency key states in Redis</title>
<desc id="idem-desc">A new key starts as PROCESSING with an owner token, can be taken over after a 5-minute timeout, and becomes COMPLETED when its owner stores the response, which is replayed on repeats. After the 3-hour TTL the key disappears. A different body is a 409 conflict, a late old owner gets STALE_OWNER.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #idempotency-redis-states-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #idempotency-redis-states-root .c { width:100%;overflow-x:auto }</style>
<marker id="idempotency-redis-states-idem-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="idempotency-redis-states-idem-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="idempotency-redis-states-idem-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="380" fill="#F9F9F9"/>
<line x1="174" y1="150" x2="300" y2="150" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#idempotency-redis-states-idem-a)"/><rect x="216" y="129" width="42" height="14" rx="2" fill="#F9F9F9"/><text x="237" y="140" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">START</text><line x1="460" y1="150" x2="580" y2="150" stroke="#E14817" stroke-width="1.2" marker-end="url(#idempotency-redis-states-idem-ac)"/><rect x="490" y="129" width="60" height="14" rx="2" fill="#F9F9F9"/><text x="520" y="140" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text><path d="M680,120 V56 Q680,48 672,48 H107 Q99,48 99,56 V120" fill="none" stroke="#5C5C5C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idempotency-redis-states-idem-a)"/><rect x="348" y="27" width="84" height="14" rx="2" fill="#F9F9F9"/><text x="390" y="38" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">TTL, 3 HOURS</text><path d="M340,180 V216 Q340,224 348,224 H412 Q420,224 420,216 V184" fill="none" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#idempotency-redis-states-idem-a)"/><text x="380" y="244" fill="#666666" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">timeout takeover</text><path d="M620,180 V216 Q620,224 628,224 H692 Q700,224 700,216 V184" fill="none" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#idempotency-redis-states-idem-a)"/><text x="660" y="244" fill="#666666" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">replay response</text><rect x="24" y="120" width="150" height="60" rx="6" fill="#F9F9F9"/><rect x="24" y="120" width="150" height="60" rx="6" fill="#5c5c5c" stroke="#666666" stroke-width="1" fill-opacity="0.10"/><text x="99.0" y="155.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">No key</text><rect x="300" y="120" width="160" height="60" rx="6" fill="#F9F9F9"/><rect x="300" y="120" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="380.0" y="149.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PROCESSING</text><text x="380.0" y="165.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">owner token</text><rect x="580" y="120" width="160" height="60" rx="6" fill="#F9F9F9"/><rect x="580" y="120" width="160" height="60" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="660.0" y="149.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">COMPLETED</text><text x="660.0" y="165.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">stored response</text><text x="380" y="288" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Same key, different body: 409 CONFLICT.</text><text x="380" y="308" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">A late owner with an old token gets STALE_OWNER.</text><line x1="16" y1="336" x2="744" y2="336" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="358" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="347" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="358" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Result replayed</text><line x1="252.5" y1="354" x2="280.5" y2="354" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#idempotency-redis-states-idem-a)"/><text x="288.5" y="358" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Lua script result</text><line x1="416.8" y1="354" x2="444.8" y2="354" stroke="#5C5C5C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#idempotency-redis-states-idem-a)"/><text x="452.8" y="358" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Expiry</text>
</svg>
