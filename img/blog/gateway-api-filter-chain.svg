if" text-anchor="middle">URLRewrite</text><rect x="158" y="485" width="50" height="14" rx="2" fill="none" stroke="#333333" stroke-opacity="0.4" stroke-width="0.8"/><text x="183.2" y="495.5" fill="#666666" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">NATIVE</text><text x="510" y="497" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">strip /auditflow/api/v1</text><rect x="150" y="536" width="340" height="40" rx="6" fill="#F9F9F9"/><rect x="150" y="536" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="320.0" y="561.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Module service</text><text x="510" y="561" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">af-auditflow:8080</text><line x1="16" y1="600" x2="744" y2="600" stroke="rgba(51,51,51,0.1)" stroke-width="0.8"/><text x="16" y="622" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="611" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="622" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Always first</text><rect x="237.8" y="611" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#333333"/><text x="270.8" y="622" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Native Gateway API filter</text><rect x="449.3" y="611" width="22" height="14" rx="3" fill="#333333" stroke="rgba(51,51,51,0.45)" fill-opacity="0.03"/><text x="482.3" y="622" fill="#5