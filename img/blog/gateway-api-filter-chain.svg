<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gwchain-title gwchain-desc" id="gateway-api-filter-chain-root">
<title id="gwchain-title">Filter order in one HTTPRoute rule</title>
<desc id="gwchain-desc">The rendered AuditFlow route runs seven filters in order: strip client X-Auth headers natively, Traefik ForwardAuth, rate limit and buffering, native security response headers, Traefik compression, and a native URLRewrite before the module service.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #gateway-api-filter-chain-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #gateway-api-filter-chain-root .c { width:100%;overflow-x:auto }</style>
