teway-ratelimit</text><rect x="158" y="229" width="57" height="14" rx="2" fill="none" stroke="#333333" stroke-opacity="0.4" stroke-width="0.8"/><text x="186.4" y="239.5" fill="#666666" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TRAEFIK</text><text x="510" y="241" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">rate limiting</text><text x="134" y="305" fill="#666666" font-size="11" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="end">4</text><rect x="150" y="280" width="340" height="40" rx="6" fill="#F9F9F9"/><rect x="150" y="280" width="340" height="40" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="320.0" y="305.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">authgateway-buffering</text><rect x="158" y="293" width="57" height="14" rx="2" fill="none" stroke="#333333" stroke-opacity="0.4" stroke-width="0.8"/><text x="186.4" y="303.5" fill="#666666" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TRAEFIK</text><text x="510" y="305" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">request buffering</text><text x="134" y="369" fill="#666666" font-size="11" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="end">5</text><rect x="150" y="344" width="340" height="40" rx="6" fill="#F9F9F9"/><rect x="150" y="344" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="320.0" y="369.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle