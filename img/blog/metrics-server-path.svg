<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="metrics-path-title metrics-path-desc"><title id="metrics-path-title">Where kubectl top gets its numbers</title><desc id="metrics-path-desc">Kubelets report usage to metrics-server, which the kube-apiserver serves as the metrics.k8s.io API read by kubectl top and the autoscalers.</desc><defs><marker id="metrics-path-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="metrics-path-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="metrics-path-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="360" fill="#F9F9F9"/><path d="M144,148 L192,148" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#metrics-path-ah-def)"/><path d="M368,148 L416,148" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#metrics-path-ah-def)"/><path d="M576,136 L596.0,136.0 Q604,136 604.0,128.0 L604.0,88.0 Q604,80 612.0,80.0 L632,80" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#metrics-path-ah-def)"/><path d="M576,160 L596.0,160.0 Q604,160 604.0,168.0 L604.0,208.0 Q604,216 612.0,216.0 L632,216" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#metrics-path-ah-def)"/><rect x="24" y="120" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="84.0" y="145.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">kubelet</text><text x="84.0" y="162.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">per node</text><rect x="192" y="120" width="176" height="56" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="280.0" y="145.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">metrics-server</text><text x="280.0" y="162.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">current values</text><rect x="416" y="104" width="160" height="88" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="496.0" y="145.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">kube-apiserver</text><text x="496.0" y="162.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">metrics.k8s.io/v1beta1</text><rect x="632" y="56" width="144" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="704.0" y="84.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">kubectl top</text><rect x="632" y="192" width="144" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="704.0" y="220.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">HPA and VPA</text><rect x="144.8" y="126.0" width="46.4" height="16" fill="#F9F9F9"/><text x="168.0" y="137.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="middle">SCRAPE</text><text x="24" y="304" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">'Metrics API not available' means this API is not registered.</text><text x="24" y="324" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">'Metrics not available for pod' means it is registered but has no data for that pod.</text></svg>