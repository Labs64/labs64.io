<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ccy-title ccy-desc" id="paypal-currency-conversion-root">
<title id="ccy-title">Minor units to PayPal amounts</title>
<desc id="ccy-desc">The PayPal converter normalizes the currency code, rejects unknown codes, takes PayPal overrides for HUF and TWD or the ISO 4217 fraction digits, and converts exactly or throws. Examples: USD 3000 to 30.00, TND 1234 to 1.234, HUF 100 to 100, JPY 3000 to 3000.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #paypal-currency-conversion-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #paypal-currency-conversion-root .c { width:100%;overflow-x:auto }</style>
<marker id="paypal-currency-conversion-ccy-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="paypal-currency-conversion-ccy-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="paypal-currency-conversion-ccy-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="316" fill="#F9F9F9"/>
