amily="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Normalize</text><text x="230.0" y="136.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">trim,</text><text x="230.0" y="150.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">upper-case</text><polygon points="356,96.0 408.0,128 356,160.0 304.0,128" fill="#F9F9F9"/><polygon points="356,96.0 408.0,128 356,160.0 304.0,128" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="356" y="132" fill="#333333" font-size="12" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">ISO code?</text><text x="422" y="118" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">YES</text><rect x="436" y="96" width="144" height="64" rx="6" fill="#F9F9F9"/><rect x="436" y="96" width="144" height="64" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="508.0" y="120.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Fraction digits</text><text x="508.0" y="136.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">HUF, TWD: 0</text><text x="508.0" y="150.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">else ISO 4217</text><rect x="604" y="96" width="140" height="64" rx="6" fill="#F9F9F9"/><rect x="604" y="96" width="140" height="64" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="674.0" y="120.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Convert</text><text x="674.0" y="136.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">exact or throw</text><text x="674.0" y="150.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">toPlainString()</text><rect x="286" y="216" width="140" height="56" rx="6" fill="#F9F9F9"/><rect x="286" y="216" width="140" height="56" rx="6" fill="#333333" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="356.0" y="243.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Rejected</text><text x="356.0" y="259.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">unknown or XXX</text><rect x="604" y="216" width="140" height="56" rx="6" fill="#F9F9F9"/><rect x="604" y="216" width="140" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="674.0" y="243.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PayPal value</text><text x="674.0" y="259.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">"3000"</text><text x="380" y="316" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">USD 3000 → "30.00"   ·   TND 1234 → "1.234"   ·   HUF 100 → "100"   ·   JPY 3000 → "3000"</text><line x1="16" y1="344" x2="744" y2="344" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="366" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="355" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">RoundingMode.UNNECESSARY</text><rect x="308.6" y="355" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="341.6" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">PayPal overrides ISO</text><rect x="490.6" y="355" width="22" height="14" rx="3" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="523.6" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">ProviderValidationException</text></g>
