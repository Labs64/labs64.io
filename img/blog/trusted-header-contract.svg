ne x1="602" y1="204" x2="602" y2="224" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#trusted-header-contract-hdr-a)"/><rect x="24" y="80" width="140" height="64" rx="6" fill="#F9F9F9"/><rect x="24" y="80" width="140" height="64" rx="6" fill="#5c5c5c" stroke="#666666" stroke-width="1" fill-opacity="0.10"/><text x="94.0" y="104.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Client</text><text x="94.0" y="120.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Bearer token</text><text x="94.0" y="134.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">maybe X-Auth-*</text><rect x="212" y="80" width="192" height="64" rx="6" fill="#F9F9F9"/><rect x="212" y="80" width="192" height="64" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="308.0" y="104.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Auth Gateway</text><text x="308.0" y="120.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">strip X-Auth-*</text><text x="308.0" y="134.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">verify, then set</text><rect x="212" y="172" width="192" height="104" rx="6" fill="#F9F9F9"/><rect x="212" y="172" width="192" height="104" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="308.0" y="202.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Trusted headers</text><text x="308.0" y="218.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X-Auth-User</text><text x="308.0" y="232.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X-Auth-Scopes</text><text x="308.0" y="246.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X-Auth-Tenant</text><text x="308.0" y="260.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X-Request-ID</text><rect x="468" y="72" width="268" height="56" rx="6" fill="#F9F9F9"/><rect x="468" y="72" width="268" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="602.0" y="99.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">auth-context starter</text><text x="602.0" y="115.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">parse, validate pattern</text><rect x="468" y="148" width="268" height="56" rx="6" fill="#F9F9F9"/><rect x="468" y="148" width="268" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="602.0" y="175.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">AuthContext record</text><text x="602.0" y="191.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">user, tenant, scopes, id</text><rect x="468" y="224" width="268" height="56" rx="6" fill="#F9F9F9"/><rect x="468" y="224" width="268" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="602.0" y="251.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">@RequireScopes</text><text x="602.0" y="267.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">401 or 403, fail closed</text><text x="94" y="206" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">forged headers</text><text x="94" y="222" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">never get through</text><line x1="16" y1="320" x2="744" y2="320" stroke="rgba(51,51,51,0.1)" stroke-width="0.8"/><text x="16" y="342" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="331" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="342" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Verifies once</text><rect x="243.7" y="331" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="276.7" y="342" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">What services receive</text><rect x="431.6" y="331" width="22" height="14" rx="3" fill="#5c5c5c" stroke="#666666" fill-opacity="0.10"/><text x="464.6" y="342" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Untrusted caller</text>
