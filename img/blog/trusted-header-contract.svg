<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdr-title hdr-desc" id="trusted-header-contract-root">
<title id="hdr-title">Trusted header contract</title>
<desc id="hdr-desc">The Auth Gateway at the edge strips client X-Auth headers, verifies the token and sets four trusted headers. Inside the private network, the auth-context starter parses them into an AuthContext record and @RequireScopes fails closed with 401 or 403.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #trusted-header-contract-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #trusted-header-contract-root .c { width:100%;overflow-x:auto }</style>
<marker id="trusted-header-contract-hdr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="trusted-header-contract-hdr-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="trusted-header-contract-hdr-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="364" fill="#F9F9F9"/>
