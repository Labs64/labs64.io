<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="extra-title extra-desc" id="auditflow-extra-flow-root">
<title id="extra-title">Where extra keys end up</title>
<desc id="extra-desc">An audit event with known, unknown and missing extra keys goes through a transformer. Known keys become columns or fields, unknown keys are kept in a map, nested object or structured metadata, and missing keys stay missing. A promotion map from code or AUDITFLOW_PROMOTED_KEYS adds your own columns.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #auditflow-extra-flow-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #auditflow-extra-flow-root .c { width:100%;overflow-x:auto }</style>
<marker id="auditflow-extra-flow-extra-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="auditflow-extra-flow-extra-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="auditflow-extra-flow-extra-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
