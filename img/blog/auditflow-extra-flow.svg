iddle">Map(String, String)</text><rect x="524" y="136" width="220" height="64" rx="6" fill="#F9F9F9"/><rect x="524" y="136" width="220" height="64" rx="6" fill="#333333" stroke="#333333" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.45"/><text x="634.0" y="160.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OpenSearch</text><text x="634.0" y="176.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">fields +</text><text x="634.0" y="190.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">nested extra object</text><rect x="524" y="232" width="220" height="64" rx="6" fill="#F9F9F9"/><rect x="524" y="232" width="220" height="64" rx="6" fill="#333333" stroke="#333333" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.45"/><text x="634.0" y="256.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Loki</text><text x="634.0" y="272.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">labels +</text><text x="634.0" y="286.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">structured metadata</text><text x="116" y="250" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">absent stays absent:</text><text x="116" y="268" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">no "unknown", no N/A</text><line x1="16" y1="340" x2="744" y2="340" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="362" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="351" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="362" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Applies the four rules</text><rect x="296.8" y="351" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="329.8" y="362" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Code or operator config</text><rect x="496.5" y="351" width="22" height="14" rx="3" fill="#333333" stroke="#333333" fill-opacity="0.03" stroke-opacity="0.45"/><text x="529.5" y="362" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Destination</text>
