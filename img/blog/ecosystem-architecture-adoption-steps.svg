w, nothing else</text><rect x="556.0" y="240" width="176" height="48" fill="#333333" fill-opacity="0.09"/><text x="644.0" y="164" fill="#5C5C5C" font-size="10" font-weight="600" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">04</text><line x1="644.0" y1="184" x2="644.0" y2="220" stroke="#BFBFBF"/><circle cx="644.0" cy="264" r="36" fill="#F9F9F9"/><circle cx="644.0" cy="264" r="36" fill="none" stroke="#333333"/><g aria-hidden="true" transform="translate(632.0,252)" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 7 7a6 6 0 0 0 3 -5a9 9 0 0 0 6 -8a3 3 0 0 0 -3 -3a9 9 0 0 0 -8 6a6 6 0 0 0 -5 3" /> <path d="M7 14a6 6 0 0 0 -3 6a6 6 0 0 0 6 -3" /> <path d="M14 9a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></g><text x="644.0" y="360" fill="#333333" font-size="14" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Add the rest later</text><text x="644.0" y="386" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">More charts, or the</text><text x="644.0" y="404" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">umbrella chart for all</text>
