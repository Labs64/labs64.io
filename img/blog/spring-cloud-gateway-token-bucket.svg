<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" role="img" aria-labelledby="token-bucket-title token-bucket-desc"><title id="token-bucket-title">The token bucket</title><desc id="token-bucket-desc">Tokens refill at a steady rate up to the bucket size; each request takes tokens; when the bucket is empty the gateway answers HTTP 429.</desc><defs><marker id="token-bucket-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="token-bucket-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="token-bucket-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="328" fill="#F9F9F9"/><path d="M112,88 L112,136" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#token-bucket-ah-def)"/><path d="M200,192 L288,192" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#token-bucket-ah-def)"/><path d="M472,176 L508.0,176.0 Q516,176 516.0,168.0 L516.0,128.0 Q516,120 524.0,120.0 L560,120" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#token-bucket-ah-def)"/><path d="M472,208 L508.0,208.0 Q516,208 516.0,216.0 L516.0,256.0 Q516,264 524.0,264.0 L560,264" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#token-bucket-ah-def)"/><rect x="24" y="40" width="176" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="112.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Refill</text><text x="112.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">replenishRate per second</text><rect x="24" y="136" width="176" height="112" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="112.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Bucket</text><text x="112.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">one bucket per key</text><rect x="288" y="160" width="184" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="380.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Request</text><text x="380.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">takes requestedTokens</text><rect x="560" y="96" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="668.0" y="117.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Forwarded</text><text x="668.0" y="134.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">tokens left: route continues</text><rect x="560" y="240" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="668.0" y="261.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">HTTP 429</text><text x="668.0" y="278.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">bucket empty: rejected</text><rect x="217.6" y="170.0" width="52.8" height="16" fill="#F9F9F9"/><text x="244.0" y="181.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="middle">REQUEST</text><text x="24" y="312" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">One bucket per key (user, API key or IP). Redis, Bucket4j and the MVC filter share this model.</text></svg>