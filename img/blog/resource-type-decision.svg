0.02" stroke-opacity="0.35"/><text x="632.0" y="240.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">ResourceResolver</text><text x="632.0" y="256.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">gets "#paymentId"</text><text x="632.0" y="270.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">loads the entity</text><rect x="16" y="216" width="220" height="64" rx="6" fill="#F9F9F9"/><rect x="16" y="216" width="220" height="64" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="126.0" y="240.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Build fails</text><text x="126.0" y="256.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">resource requires</text><text x="126.0" y="270.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">resourceType</text><rect x="280" y="332" width="200" height="60" rx="6" fill="#F9F9F9"/><rect x="280" y="332" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="380.0" y="361.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Edge-only</text><text x="380.0" y="377.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">gateway checks route</text><line x1="16" y1="420" x2="744" y2="420" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="442" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monosp