<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rref-title rref-desc" id="resource-type-decision-root">
<title id="rref-title">How x-labs64.auth resource fields are handled</title>
<desc id="rref-desc">If an operation sets resourceType, the build generates a Cerbos permit, a tenant guard and @Authorize; an extra resource reference is passed to the ResourceResolver. Without resourceType, a resource reference fails the build, and an operation with neither is checked at the edge only.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #resource-type-decision-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #resource-type-decision-root .c { width:100%;overflow-x:auto }</style>
<marker id="resource-type-decision-rref-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="resource-type-decision-rref-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
