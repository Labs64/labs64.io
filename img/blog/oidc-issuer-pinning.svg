<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iss-title iss-desc" id="oidc-issuer-pinning-root">
<title id="iss-title">Pinning the OIDC issuer</title>
<desc id="iss-desc">The Auth Gateway fetches the discovery document over the in-cluster Keycloak URL only to find the JWKS keys. The issuer it accepts comes from OIDC_ISSUER, the public issuer that the client tokens carry.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #oidc-issuer-pinning-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #oidc-issuer-pinning-root .c { width:100%;overflow-x:auto }</style>
<marker id="oidc-issuer-pinning-iss-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="oidc-issuer-pinning-iss-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="oidc-issuer-pinning-iss-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="316" fill="#F9F9F9"/>
