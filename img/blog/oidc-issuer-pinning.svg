font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">JWT with iss =</text><text x="101.0" y="178.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">public URL</text><rect x="284" y="112" width="192" height="88" rx="6" fill="#F9F9F9"/><rect x="284" y="112" width="192" height="88" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="380.0" y="148.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Auth Gateway</text><text x="380.0" y="164.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">keys: discovery</text><text x="380.0" y="178.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">issuer: config</text><rect x="572" y="112" width="172" height="88" rx="6" fill="#F9F9F9"/><rect x="572" y="112" width="172" height="88" rx="6" fill="#333333" stroke="#333333" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.45"/><text x="658.0" y="148.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Keycloak</text><text x="658.0" y="164.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">in-cluster URL</text><text x="658.0" y="178.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">public URL</text><rect x="284" y="272" width="192" height="56" rx="6" fill="#F9F9F9"/><rect x="284" y="272" width="192" height="56" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="380.0" y="299.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OIDC_ISSUER</text><text x="380.0" y="315.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">the public issuer</text><text x="620" y="272" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Discovery says where the keys are.</text><text x="620" y="290" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Configuration says whom to trust.</text><line x1="16" y1="360" x2="744" y2="360" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="382" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="371" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="382" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Verifies RS256 + exp</text><rect x="285.0" y="371" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="318.0" y="382" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Explicit trust</text><rect x="431.6" y="371" width="22" height="14" rx="3" fill="#333333" stroke="#333333" fill-opacity="0.03" stroke-opacity="0.45"/><text x="464.6" y="382" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Identity provider</text></g>
</svg>
