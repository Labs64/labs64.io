<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s3ctx-title s3ctx-desc" id="s3-sink-context-root">
<title id="s3ctx-title">Where the S3 sink sits</title>
<desc id="s3ctx-desc">The AuditFlow backend sends each event to the S3 sink service and waits up to 15 seconds. The sink writes the event to S3 or MinIO with boto3.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #s3-sink-context-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #s3-sink-context-root .c { width:100%;overflow-x:auto }</style>
<marker id="s3-sink-context-s3ctx-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="s3-sink-context-s3ctx-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="s3-sink-context-s3ctx-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="212" fill="#F9F9F9"/>
<g transform="translate(0,-36)"><line x1="200" y1="96" x2="272" y2="96" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#s3-sink-context-s3ctx-a)"/><rect x="215" y="75" width="42" height="14" rx="2" fill="#F9F9F9"/><text x="236" y="86" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text><line x1="488" y1="96" x2="560" y2="96" stroke="#E14817" stroke-width="1.2" marker-end="url(#s3-sink-context-s3ctx-ac)"/><rect x="509" y="75" width="30" height="14" rx="2" fill="#F9F9F9"/><text x="524" y="86" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PUT</text><rect x="16" y="60" width="184" height="72" rx="6" fill="#F9F9F9"/><rect x="16" y="60" width="184" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="108.0" y="88.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">AuditFlow backend</text><text x="108.0" y="104.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">routes events,</text><text x="108.0" y="118.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">waits up to 15 s</text><rect x="272" y="60" width="216" height="72" rx="6" fill="#F9F9F9"/><rect x="272" y="60" width="216" height="72" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="380.0" y="88.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">S3 sink</text><text x="380.0" y="104.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Python service</text><text x="380.0" y="118.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">boto3 client</text><rect x="560" y="60" width="184" height="72" rx="6" fill="#F9F9F9"/><rect x="560" y="60" width="184" height="72" rx="6" fill="#333333" stroke="#333333" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.45"/><text x="652.0" y="95.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">S3 or MinIO</text><text x="652.0" y="111.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">object storage</text><text x="380" y="176" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">If the PUT hangs, the sink worker hangs, and the backend stops waiting first.</text><line x1="16" y1="204" x2="744" y2="204" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="226" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="215" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="226" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Where the fix lives</text><rect x="279.1" y="215" width="22" height="14" rx="3" fill="#333333" stroke="#333333" fill-opacity="0.03" stroke-opacity="0.45"/><text x="312.1" y="226" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Can be slow or stuck</text></g>
</svg>
