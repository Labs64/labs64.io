<svg viewBox="0 0 760 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ro-title ro-desc" id="readonly-root-emptydir-root">
<title id="ro-title">Read-only root with a writable /tmp</title>
<desc id="ro-desc">The AuditFlow Pod runs a Java backend and two Python sidecars, each with a read-only root filesystem. One emptyDir volume named tmp is mounted at /tmp in all three, the only writable path.</desc>
