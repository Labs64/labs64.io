333333" stroke-width="1"/><text x="644.0" y="86.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">AuditFlow</text><text x="644.0" y="102.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">POST /audit/publish</text><text x="644.0" y="116.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">paths at the root</text><rect x="16" y="240" width="200" height="64" rx="6" fill="#F9F9F9"/><rect x="16" y="240" width="200" height="64" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="116.0" y="271.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OpenAPI spec</text><text x="116.0" y="287.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">servers: url /api/v1</text><rect x="280" y="240" width="200" height="64" rx="6" fill="#F9F9F9"/><rect x="280" y="240" width="200" height="64" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="380.0" y="271.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Helm route value</text><text x="380.0" y="287.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">path: /api/v1, stripPath</text><rect x="544" y="240" width="200" height="64" rx="6" fill="#F9F9F9"/><rect x="544" y="240" width="200" height="64" rx="6" fill="#333333" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="644.0" y="271.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Controllers</text><text x="644.0" y="287.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">no version in code</text><line x1="16" y1="344" x2="744" y2="344" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="366" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="355" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Owns the prefix</text><rect x="255.5" y="355" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="288.5" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Declares it once</text><line x1="410.9" y1="362" x2="438.9" y2="362" stroke="#5C5C5C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#api-prefix-gateway-path-apiprefix-a)"/><text x="446.9" y="366" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Feeds into</text>
