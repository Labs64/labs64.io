<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apiprefix-title apiprefix-desc" id="api-prefix-gateway-path-root">
<title id="apiprefix-title">Gateway-owned API version prefix</title>
<desc id="apiprefix-desc">A client calls /auditflow/api/v1/audit/publish; the Traefik gateway matches the prefix and rewrites it, so AuditFlow serves /audit/publish. The prefix is declared only in the OpenAPI servers entry and the Helm route value.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #api-prefix-gateway-path-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #api-prefix-gateway-path-root .c { width:100%;overflow-x:auto }</style>
<marker id="api-prefix-gateway-path-apiprefix-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="api-prefix-gateway-path-apiprefix-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="api-prefix-gateway-path-apiprefix-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
