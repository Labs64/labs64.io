<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bw-title bw-desc" id="bounded-wait-limiter-root">
<title id="bw-title">Fail fast versus bounded wait</title>
<desc id="bw-desc">Before, a delivery over the per-tenant cap was rejected, redelivered by the broker and dead-lettered after its attempts were used up. After, it waits up to two seconds for a slot and, if none frees up, is deferred without spending an attempt.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bounded-wait-limiter-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #bounded-wait-limiter-root .c { width:100%;overflow-x:auto }</style>
<marker id="bounded-wait-limiter-bw-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="bounded-wait-limiter-bw-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="bounded-wait-limiter-bw-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="432" fill="#F9F9F9"/>
<rect x="8" y="24" width="744" height="108" rx="8" fill="#333333" stroke="#333333" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/><rect x="20" y="17" width="135" height="14" rx="2" fill="#F9F9F9"/><text x="87.4" y="27" fill="#666666" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">BEFORE · FAIL FAST</text><rect x="8" y="168" width="744" height="196" rx="8" fill="#333333" stroke="#333333" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/><rect x="20" y="161" width="148" height="14" rx="2" fill="#F9F9F9"/><text x="94.0" y="171" fill="#666666" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">AFTER · BOUNDED WAIT</text><line x1="136" y1="78" x2="176" y2="78" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><rect x="144" y="57" width="24" height="14" rx="2" fill="#F9F9F9"/><text x="156" y="68" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><line x1="352" y1="78" x2="420" y2="78" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><rect x="371" y="57" width="30" height="14" rx="2" fill="#F9F9F9"/><text x="386" y="68" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">× N</text><line x1="136" y1="224" x2="176" y2="224" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><rect x="144" y="203" width="24" height="14" rx="2" fill="#F9F9F9"/><text x="156" y="214" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><line x1="326" y1="224" x2="364" y2="224" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><line x1="476" y1="224" x2="520" y2="224" stroke="#E14817" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-ac)"/><rect x="486" y="203" width="24" height="14" rx="2" fill="#F9F9F9"/><text x="498" y="214" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><path d="M80,252 V316 Q80,324 88,324 H176" fill="none" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><rect x="88" y="273" width="30" height="14" rx="2" fill="#F9F9F9"/><text x="103.0" y="283" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><line x1="420" y1="252" x2="420" y2="300" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#bounded-wait-limiter-bw-a)"/><rect x="428" y="269" width="30" height="14" rx="2" fill="#F9F9F9"/><text x="443.0" y="279" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><polygon points="80,50.0 136.0,78 80,106.0 24.0,78" fill="#F9F9F9"/><polygon points="80,50.0 136.0,78 80,106.0 24.0,78" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="80" y="82" fill="#333333" font-size="12" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">slot free?</text><rect x="176" y="54" width="176" height="48" rx="6" fill="#F9F9F9"/><rect x="176" y="54" width="176" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="264.0" y="77.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Reject</text><text x="264.0" y="93.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">broker redelivers</text><rect x="420" y="54" width="176" height="48" rx="6" fill="#F9F9F9"/><rect x="420" y="54" width="176" height="48" rx="6" fill="#333333" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="508.0" y="77.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Dead-lettered</text><text x="508.0" y="93.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">attempts used up</text><polygon points="80,196.0 136.0,224 80,252.0 24.0,224" fill="#F9F9F9"/><polygon points="80,196.0 136.0,224 80,252.0 24.0,224" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="80" y="228" fill="#333333" font-size="12" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">slot free?</text><rect x="176" y="200" width="150" height="48" rx="6" fill="#F9F9F9"/><rect x="176" y="200" width="150" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="251.0" y="223.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Wait up to 2 s</text><text x="251.0" y="239.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">tryAcquire(timeout)</text><polygon points="420,196.0 476.0,224 420,252.0 364.0,224" fill="#F9F9F9"/><polygon points="420,196.0 476.0,224 420,252.0 364.0,224" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="420" y="228" fill="#333333" font-size="12" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">freed?</text><rect x="520" y="200" width="224" height="48" rx="6" fill="#F9F9F9"/><rect x="520" y="200" width="224" height="48" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="632.0" y="223.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Defer</text><text x="632.0" y="239.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">no attempt spent</text><rect x="176" y="300" width="320" height="48" rx="6" fill="#F9F9F9"/><rect x="176" y="300" width="320" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="336.0" y="323.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Deliver</text><text x="336.0" y="339.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">one semaphore per tenant</text><line x1="16" y1="388" x2="744" y2="388" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="410" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="399" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="410" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Event kept, retried later</text><rect x="314.5" y="399" width="22" height="14" rx="3" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="347.5" y="410" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Lost to the DLQ</text><rect x="467.0" y="399" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#333333"/><text x="500.0" y="410" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Normal path</text>
</svg>
