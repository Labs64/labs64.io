<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="req-title req-desc" id="req-root">
<title id="req-title">Request path through the Labs64.IO gateway</title>
<desc id="req-desc">Sequence of a request: Traefik strips auth headers, the Auth Gateway verifies the token and asks Cerbos, then the request is forwarded to the module.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #req-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #req-root .c { width:100%;overflow-x:auto }</style>
<marker id="req-req-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="req-req-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
</defs>
<rect x="0" y="0" width="760" height="640" fill="#F9F9F9"/>
