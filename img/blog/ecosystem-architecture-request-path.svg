"'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST+TOKEN</text><rect x="261.0" y="203" width="68" height="14" rx="2" fill="#F9F9F9"/><text x="295" y="214" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">GET /AUTH</text><rect x="414.0" y="287" width="72" height="14" rx="2" fill="#F9F9F9"/><text x="450" y="298" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">IS_ALLOWED</text><rect x="428.0" y="327" width="44" height="14" rx="2" fill="#F9F9F9"/><text x="450" y="338" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text><rect x="249.0" y="367" width="92" height="14" rx="2" fill="#F9F9F9"/><text x="295" y="378" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">OK + X-AUTH-*</text><rect x="422.0" y="415" width="56" height="14" rx="2" fill="#F9F9F9"/><text x="450" y="426" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">FORWARD</text><rect x="420.0" y="455" width="60" height="14" rx="2" fill="#F9F9F9"/><text x="450" y="466" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text><rect x="114.0" y="491" width="60" height="14" rx="2" fill="#F9F9F9"/><text x="144" y="502" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">RESPONSE</text><rect x="262" y="171" width="100" height="14" rx="2" fill="#F9F9F9"/><text x="312" y="181" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">STRIP X-AUTH-*</text><rect x="416" y="259" width="88" height="14" rx="2" fill="#F9F9F9"/><text x="460" y="269" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY TOKEN</text><rect x="214" y="128" width="8" height="392" fill="#F9F9F9"/><rect x="214" y="128" width="8" height="392" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="368" y="212" width="8" height="184" fill="#F9F9F9"/><rect x="368" y="212" width="8" height="184" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="524" y="296" width="8" height="60" fill="#F9F9F9"/><rect x="524" y="296" width="8" height="60" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="672" y="424" width="8" height="60" fill="#F9F9F9"/><rect x="672" y="424" width="8" height="60" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="12" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="12" y="28" width="124" height="52" rx="6" fill="#5c5c5c" stroke="#666666" stroke-width="1" fill-opacity="0.10"/><text x="74.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Client</text><text x="74.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">browser, CI, agent</text><rect x="156" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="156" y="28" width="124" height="52" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="218.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Traefik</text><text x="218.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">gateway</text><rect x="310" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="310" y="28" width="124" height="52" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="372.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Auth Gateway</text><text x="372.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">ForwardAuth</text><rect x="466" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="466" y="28" width="124" height="52" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="528.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Cerbos</text><text x="528.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">central PDP</text><rect x="614" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="614" y="28" width="124" height="52" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="676.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Module</text><text x="676.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">e.g. AuditFlow</text><text x="380" y="562" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">No route policy, or a Cerbos deny: the gateway refuses the request and the module is never reached.</text><line x1="16" y1="588" x2="744" y2="588" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="610" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="110" y1="610" x2="140" y2="610" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#req-req-a)"/><text x="148" y="614" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Call</text><line x1="210" y1="610" x2="240" y2="610" stroke="#5C5C5C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#req-req-a)"/><text x="248" y="614" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Return</text><line x1="320" y1="610" x2="350" y2="610" stroke="#E14817" stroke-width="1.2" marker-end="url(#req-req-ac)"/><text x="358" y="614" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Allowed request reaches the module</text>
</svg>
