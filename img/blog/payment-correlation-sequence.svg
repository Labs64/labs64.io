<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="corr-title corr-desc" id="payment-correlation-sequence-root">
<title id="corr-title">Following one payment by its correlation ID</title>
<desc id="corr-desc">The client creates a payment with X-Correlation-ID; the Payment Gateway stores the ID in correlation_trace and emits payment.created. When the PSP webhook arrives later without the ID, the gateway looks up the trace and emits payment.finalized with the same correlation ID.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #payment-correlation-sequence-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #payment-correlation-sequence-root .c { width:100%;overflow-x:auto }</style>
<marker id="payment-correlation-sequence-corr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="payment-correlation-sequence-corr-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="payment-correlation-sequence-corr-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="540" fill="#F9F9F9"/>
