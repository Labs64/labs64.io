690" y2="450" stroke="#E14817" stroke-width="1.2" marker-end="url(#payment-correlation-sequence-corr-ac)"/><rect x="439" y="429" width="66" height="14" rx="2" fill="#F9F9F9"/><text x="472" y="440" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">FINALIZED</text><rect x="232" y="118" width="8" height="144" fill="#F9F9F9"/><rect x="232" y="118" width="8" height="144" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="232" y="318" width="8" height="144" fill="#F9F9F9"/><rect x="232" y="318" width="8" height="144" fill="#333333" stroke="#5C5C5C" stroke-width="0.8" fill-opacity="0.06"/><rect x="14" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="14" y="28" width="124" height="52" rx="6" fill="#5c5c5c" stroke="#666666" stroke-width="1" fill-opacity="0.10"/><text x="76.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Client</text><text x="76.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X-Correlation-ID</text><rect x="174" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="174" y="28" width="124" height="52" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="236.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Payment Gateway</text><text x="236.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">MDC + filter</text><rect x="334" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="334" y="28" width="124" height="52" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="396.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PostgreSQL</text><text x="396.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">correlation_trace</text><rect x="486" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="486" y="28" width="124" height="52" rx="6" fill="#333333" stroke="#333333" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.45"/><text x="548.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PSP</text><text x="548.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Stripe, PayPal</text><rect x="628" y="28" width="124" height="52" rx="6" fill="#F9F9F9"/><rect x="628" y="28" width="124" height="52" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="690.0" y="53.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">AuditFlow</text><text x="690.0" y="69.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">audit events</text><line x1="16" y1="496" x2="744" y2="496" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="518" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="100" y1="514" x2="128" y2="514" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#payment-correlation-sequence-corr-a)"/><text x="136" y="518" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Call</text><line x1="187.6" y1="514" x2="215.6" y2="514" stroke="#5C5C5C" stroke-width="1.2" 