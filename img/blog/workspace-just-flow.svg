<title id="wsflow-title">From clone to a running platform</title>
<desc id="wsflow-desc">Five workspace commands: just clone fetches the repositories, just doctor compares tools with the pins, just up builds images and deploys to k3d, just smoke tests through the gateway, just check runs the cross-repository gates.</desc>
