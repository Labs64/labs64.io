<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s3b-title s3b-desc" id="s3-sink-timeouts-root">
<title id="s3b-title">S3 sink timeouts inside the caller window</title>
<desc id="s3b-desc">The AuditFlow backend waits 15 seconds for the sink. Each S3 PUT attempt allows 2 seconds to connect and 5 to read, two attempts add up to at most 14 seconds. A batch stops starting new writes after a 10-second budget and fails the rest as retryable.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #s3-sink-timeouts-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #s3-sink-timeouts-root .c { width:100%;overflow-x:auto }</style>
<marker id="s3-sink-timeouts-s3b-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="s3-sink-timeouts-s3b-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="s3-sink-timeouts-s3b-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="428" fill="#F9F9F9"/>
<text x="24" y="65" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">backend waits</text><text x="24" y="121" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">PUT attempt 1</text><text x="24" y="177" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">PUT attempt 2</text><text x="24" y="233" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">batch budget</text><rect x="188" y="40" width="540" height="40" rx="6" fill="#F9F9F9"/><rect x="188" y="40" width="540" height="40" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="458.0" y="65.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">15 s caller window</text><rect x="188" y="96" width="72" height="40" rx="6" fill="#F9F9F9"/><rect x="188" y="96" width="72" height="40" rx="6" fill="#333333" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="224.0" y="121.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2 s</text><rect x="260" y="96" width="180" height="40" rx="6" fill="#F9F9F9"/><rect x="260" y="96" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="350.0" y="121.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">read 5 s</text><rect x="440" y="152" width="72" height="40" rx="6" fill="#F9F9F9"/><rect x="440" y="152" width="72" height="40" rx="6" fill="#333333" stroke="#333333" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="476.0" y="177.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2 s</text><rect x="512" y="152" width="180" height="40" rx="6" fill="#F9F9F9"/><rect x="512" y="152" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="602.0" y="177.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">read 5 s</text><rect x="188" y="208" width="360" height="40" rx="6" fill="#F9F9F9"/><rect x="188" y="208" width="360" height="40" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="368.0" y="233.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">10 s, then fail the rest as retryable</text><line x1="692" y1="32" x2="692" y2="264" stroke="#E14817" stroke-width="1.2" stroke-dasharray="4,3"/><text x="686" y="284" fill="#B63A10" font-size="10" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="end">worst case 14 s</text><line x1="188" y1="300" x2="188" y2="306" stroke="#5C5C5C"/><text x="188" y="322" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">0 s</text><line x1="368" y1="300" x2="368" y2="306" stroke="#5C5C5C"/><text x="368" y="322" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">5 s</text><line x1="548" y1="300" x2="548" y2="306" stroke="#5C5C5C"/><text x="548" y="322" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">10 s</text><line x1="728" y1="300" x2="728" y2="306" stroke="#5C5C5C"/><text x="728" y="322" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">15 s</text><line x1="188" y1="300" x2="728" y2="300" stroke="#5C5C5C" stroke-width="0.8"/><text x="380" y="358" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">If the event loop itself stalls, a watchdog dumps every stack after about 20 s.</text><line x1="16" y1="384" x2="744" y2="384" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="406" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="395" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="136" y="406" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Caller deadline</text><rect x="255.5" y="395" width="22" height="14" rx="3" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="288.5" y="406" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Connect timeout</text><rect x="408.0" y="395" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="441.0" y="406" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Batch budget</text>
</svg>
