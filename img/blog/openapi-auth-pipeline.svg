ospace" text-anchor="middle">resource rules</text><rect x="416" y="260" width="160" height="60" rx="6" fill="#F9F9F9"/><rect x="416" y="260" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="496.0" y="289.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Route manifest</text><text x="496.0" y="305.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">+ public paths</text><rect x="616" y="40" width="128" height="60" rx="6" fill="#F9F9F9"/><rect x="616" y="40" width="128" height="60" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="680.0" y="69.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Java API</text><text x="680.0" y="85.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">annotations</text><rect x="616" y="150" width="128" height="60" rx="6" fill="#F9F9F9"/><rect x="616" y="150" width="128" height="60" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="680.0" y="179.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Cerbos PDP</text><text x="680.0" y="195.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">decides</text><rect x="616" y="260" width="128" height="60" rx="6" fill="#F9F9F9"/><rect x="616" y="260" width="128" height="60" rx="6" fill="#333333" stroke="rgba(51,51,51,0.45)" stroke-width="1" fill-opacity="0.03"/><text x="680.0" y="289.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Auth Gateway</t