<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oauthx-title oauthx-desc" id="openapi-auth-pipeline-root">
<title id="oauthx-title">From x-labs64.auth to enforcement</title>
<desc id="oauthx-desc">At build time the OpenApiAuthPreprocessor reads x-labs64.auth from the OpenAPI spec and writes an annotated spec for the code generator, Cerbos policies and a route manifest with public paths. At runtime the Java API, the Cerbos PDP and the Auth Gateway enforce them.</desc>
