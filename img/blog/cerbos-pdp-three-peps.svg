<svg viewBox="0 0 760 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pdp-title pdp-desc" id="cerbos-pdp-three-peps-root">
<title id="pdp-title">One PDP, three enforcement points</title>
<desc id="pdp-desc">Cerbos policies are generated from x-labs64.auth in the OpenAPI contract and loaded by one central Cerbos PDP. The edge PEP (Auth Gateway) asks over HTTP, the domain PEP (@Authorize) and data PEP (query plan) over gRPC. Errors deny.</desc>
