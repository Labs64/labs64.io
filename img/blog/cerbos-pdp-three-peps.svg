-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">the answer is deny</text><rect x="24" y="264" width="220" height="72" rx="6" fill="#F9F9F9"/><rect x="24" y="264" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="134.0" y="292.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Edge PEP</text><text x="134.0" y="308.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Auth Gateway</text><text x="134.0" y="322.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">may call operation?</text><rect x="270" y="264" width="220" height="72" rx="6" fill="#F9F9F9"/><rect x="270" y="264" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="380.0" y="292.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Domain PEP</text><text x="380.0" y="308.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">@Authorize</text><text x="380.0" y="322.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">may act on resource?</text><rect x="516" y="264" width="220" height="72" rx="6" fill="#F9F9F9"/><rect x="516" y="264" width="220" height="72" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="626.0" y="292.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Data PEP</text><text x="626.0" y="308.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">query plan to JPA</text>