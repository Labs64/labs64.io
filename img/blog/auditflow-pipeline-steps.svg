="316.0" y="109.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">transformer: zero</text><rect x="192" y="168" width="248" height="56" rx="6" fill="#F9F9F9"/><rect x="192" y="168" width="248" height="56" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="316.0" y="195.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">aws_s3_sink</text><text x="316.0" y="211.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">returns bucket + key</text><rect x="488" y="80" width="256" height="48" rx="6" fill="#F9F9F9"/><rect x="488" y="80" width="256" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="616.0" y="109.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">my_index_transformer</text><rect x="488" y="168" width="256" height="56" rx="6" fill="#F9F9F9"/><rect x="488" y="168" width="256" height="56" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="616.0" y="195.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">clickhouse_sink</text><text x="616.0" y="211.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">row points to the archive</text><rect x="176" y="280" width="576" height="64" rx="6" fill="#F9F9F9"/><rect x="176" y="280" width="576" height="64" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="464.0" y="311.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Delivery headers on retry, defer and DLQ</text><text x="464.0" y="327.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">x-auditflow-steps-done: 1   x-auditflow-context: {"original":{…}}</text><text x="320" y="150" fill="#5C5C5C" font-size="10" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle"></text><text x="380" y="384" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">If step 2 fails, the retry resumes at step 2; step 1 does not run again.</text><line x1="16" y1="412" x2="744" y2="412" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="434" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="100" y1="430" x2="128" y2="430" stroke="#E14817" stroke-width="1.2" marker-end="url(#auditflow-pipeline-steps-steps-ac)"/><text x="136" y="434" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Context of step 1, by step name</text><rect x="349.9" y="423" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="382.9" y="434" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Progress travels with the message</text><rect x="608.6" y="423" width="22" height="14" rx="3" fill="#333333" stroke="#5C5C5C" fill-opacity="0.05"/><text x="641.6" y="434" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Sink</text>
