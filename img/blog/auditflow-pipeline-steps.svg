<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="steps-title steps-desc" id="auditflow-pipeline-steps-root">
<title id="steps-title">A two-step AuditFlow pipeline</title>
<desc id="steps-desc">Step 1 passes the event unchanged to the S3 sink, which returns the bucket and key. AuditFlow hands that context, under the step name original, to step 2, whose transformer writes a ClickHouse row pointing to the archive. Progress and context travel in delivery headers, so a retry resumes at the failed step.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #auditflow-pipeline-steps-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #auditflow-pipeline-steps-root .c { width:100%;overflow-x:auto }</style>
<marker id="auditflow-pipeline-steps-steps-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="auditflow-pipeline-steps-steps-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="auditflow-pipeline-steps-steps-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
