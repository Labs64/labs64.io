<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" role="img" aria-labelledby="traefik-pipeline-title traefik-pipeline-desc"><title id="traefik-pipeline-title">A request through router, middlewares and service</title><desc id="traefik-pipeline-desc">A client request is matched by a router, passes an ordered middleware chain and reaches the service; failed checks return an error to the client.</desc><defs><marker id="traefik-pipeline-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="traefik-pipeline-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="traefik-pipeline-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="408" fill="#F9F9F9"/><rect x="24" y="136" width="752" height="120" rx="8" fill="none" stroke="#D9D4CF" stroke-width="1.25" stroke-dasharray="6,5"/><text x="36" y="154" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.08em" fill="#6B6B6B">MIDDLEWARE CHAIN, IN ORDER</text><path d="M176,64 L288,64" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M176,204 L192,204" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M320,204 L336,204" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M464,204 L480,204" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M608,204 L624,204" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M400,88 L400,136" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><path d="M400,256 L400,312" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#traefik-pipeline-ah-def)"/><rect x="24" y="40" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="100.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Client</text><text x="100.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">HTTP request</text><rect x="288" y="40" width="224" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="400.0" y="61.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Router</text><text x="400.0" y="78.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">rule: Host + Path</text><rect x="48" y="176" width="128" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="112.0" y="201.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">headers</text><text x="112.0" y="218.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">set or strip</text><rect x="192" y="176" width="128" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="256.0" y="201.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">ipAllowList</text><text x="256.0" y="218.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">403 if refused</text><rect x="336" y="176" width="128" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="400.0" y="201.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">rateLimit</text><text x="400.0" y="218.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">429 over limit</text><rect x="480" y="176" width="128" height="56" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="544.0" y="201.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">forwardAuth</text><text x="544.0" y="218.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">401 / 403</text><rect x="624" y="176" width="128" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="688.0" y="201.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">stripPrefix</text><text x="688.0" y="218.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">X-Forwarded-Prefix</text><rect x="288" y="312" width="224" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="400.0" y="333.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Service</text><text x="400.0" y="350.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">your backend</text><rect x="408.0" y="105.0" width="52.8" height="16" fill="#F9F9F9"/><text x="412.0" y="116.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="start">MATCHED</text><rect x="408.0" y="277.0" width="52.8" height="16" fill="#F9F9F9"/><text x="412.0" y="288.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="start">FORWARD</text><text x="24" y="392" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">Router-level middlewares run first, then service-level ones (Traefik docs).</text></svg>