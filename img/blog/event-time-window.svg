<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etime-title etime-desc" id="event-time-window-root">
<title id="etime-title">Event time plausibility window</title>
<desc id="etime-desc">AuditFlow accepts an eventTime between 1095 days before and 5 minutes after the receipt time and keeps it as sent; anything older or further in the future is rejected with 400. A missing eventTime is set to the receipt time.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #event-time-window-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #event-time-window-root .c { width:100%;overflow-x:auto }</style>
<marker id="event-time-window-etime-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="event-time-window-etime-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="event-time-window-etime-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="340" fill="#F9F9F9"/>
<rect x="24" y="122" width="136" height="56" rx="6" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.03" stroke-opacity="0.35"/><text x="92" y="146" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">too old</text><text x="92" y="162" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">400</text><rect x="168" y="122" width="424" height="56" rx="6" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="380" y="146" fill="#B63A10" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">accepted: eventTime kept as sent</text><text x="380" y="162" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">last 1095 days … +5 minutes</text><rect x="600" y="122" width="136" height="56" rx="6" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.03" stroke-opacity="0.35"/><text x="668" y="146" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">in the future</text><text x="668" y="162" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">400</text><line x1="24" y1="206" x2="736" y2="206" stroke="#5C5C5C" stroke-width="1"/><line x1="168" y1="200" x2="168" y2="212" stroke="#5C5C5C"/><line x1="560" y1="200" x2="560" y2="212" stroke="#5C5C5C"/><line x1="592" y1="200" x2="592" y2="212" stroke="#5C5C5C"/><text x="168" y="230" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">now − 1095 d</text><text x="548" y="230" fill="#B63A10" font-size="10" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="end">receipt time</text><text x="600" y="230" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start">+5 min</text><circle cx="260" cy="94" r="5" fill="#E14817" stroke="#E14817"/><text x="260" y="82" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">backfill 2 years ago</text><line x1="260" y1="99" x2="260" y2="120" stroke="#333333" stroke-dasharray="2,2" stroke-opacity="0.3"/><circle cx="470" cy="94" r="5" fill="#E14817" stroke="#E14817"/><text x="470" y="82" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">clock skew −40 s</text><line x1="470" y1="99" x2="470" y2="120" stroke="#333333" stroke-dasharray="2,2" stroke-opacity="0.3"/><circle cx="668" cy="94" r="5" fill="#F9F9F9" stroke="#5C5C5C"/><text x="668" y="82" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">2099-01-01</text><line x1="668" y1="99" x2="668" y2="120" stroke="#333333" stroke-dasharray="2,2" stroke-opacity="0.3"/><text x="380" y="268" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">No eventTime sent? It is set to the receipt time, so it is never empty.</text><line x1="16" y1="298" x2="744" y2="298" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="320" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="309" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="320" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Plausible event time</text><rect x="285.0" y="309" width="22" height="14" rx="3" fill="#333333" stroke="#333333" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.35"/><text x="318.0" y="320" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Rejected before the quota gate</text>
</svg>
