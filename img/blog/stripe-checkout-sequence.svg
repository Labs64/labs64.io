<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stripe-title stripe-desc" id="stripe-checkout-sequence-root">
<title id="stripe-title">Stripe Checkout with a racing webhook</title>
<desc id="stripe-desc">The gateway creates a Stripe Checkout session with the transaction ID as idempotency key and redirects the customer. A signed webhook is verified and applied under a row lock; a browser return arriving at the same time finds a terminal transaction and changes nothing.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #stripe-checkout-sequence-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #stripe-checkout-sequence-root .c { width:100%;overflow-x:auto }</style>
