<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-labelledby="local-k8s-title local-k8s-desc"><title id="local-k8s-title">How the four tools run the cluster</title><desc id="local-k8s-desc">kind and k3d run nodes as containers, Docker Desktop runs its cluster in containers, and minikube uses a container or VM driver.</desc><defs><marker id="local-k8s-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="local-k8s-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="local-k8s-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="312" fill="#F9F9F9"/><path d="M106,160 L106,96" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#local-k8s-ah-def)"/><path d="M302,160 L302,96" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#local-k8s-ah-def)"/><path d="M498,160 L498,96" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#local-k8s-ah-def)"/><path d="M694,160 L694,96" fill="none" stroke="#853E29" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#local-k8s-ah-link)"/><rect x="24" y="40" width="752" height="56" rx="6" fill="#EFEBE7" stroke="#6B6B6B" stroke-width="1.25" stroke-dasharray="5,4"/><text x="400.0" y="65.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Container engine</text><text x="400.0" y="82.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">Docker, Podman or nerdctl (kind); Docker (k3d)</text><rect x="24" y="160" width="164" height="64" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="106.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">kind</text><text x="106.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">nodes are containers</text><rect x="220" y="160" width="164" height="64" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="302.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">k3d</text><text x="302.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">k3s in containers</text><rect x="416" y="160" width="164" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="498.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Docker Desktop</text><text x="498.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">kubeadm or kind</text><rect x="612" y="160" width="164" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="694.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">minikube</text><text x="694.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">container or VM driver</text><text x="24" y="272" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">Load local images: kind load docker-image · minikube image load · k3d image import.</text></svg>