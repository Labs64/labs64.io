<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pstate-title pstate-desc" id="payment-state-policy-root">
<title id="pstate-title">Payment transaction state policy</title>
<desc id="pstate-desc">A transaction is PENDING until a definitive provider outcome moves it to SUCCESS or FAILED. Technical failures such as timeouts, server errors, rejected credentials or invalid responses keep it PENDING and record a detail code. Terminal states never change again.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #payment-state-policy-root { font-family: Roboto, Helvetica, Arial, sans-serif; }
      #payment-state-policy-root .c { width:100%;overflow-x:auto }</style>
<marker id="payment-state-policy-pstate-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5C5C"/></marker>
<marker id="payment-state-policy-pstate-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E14817"/></marker>
<marker id="payment-state-policy-pstate-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#853E29"/></marker>
</defs>
<rect x="0" y="0" width="760" height="464" fill="#F9F9F9"/>
<path d="M240,140 H372 Q380,140 380,132 V84 Q380,76 388,76 H520" fill="none" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#payment-state-policy-pstate-a)"/><rect x="434" y="55" width="36" height="14" rx="2" fill="#F9F9F9"/><text x="452" y="66" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">PAID</text><path d="M240,172 H372 Q380,172 380,180 V228 Q380,236 388,236 H520" fill="none" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#payment-state-policy-pstate-a)"/><rect x="395" y="215" width="114" height="14" rx="2" fill="#F9F9F9"/><text x="452" y="226" fill="#666666" font-size="9" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">DECLINED, EXPIRED</text><path d="M100,192 V236 Q100,244 108,244 H172 Q180,244 180,236 V196" fill="none" stroke="#E14817" stroke-width="1.2" marker-end="url(#payment-state-policy-pstate-ac)"/><rect x="40" y="120" width="200" height="72" rx="6" fill="#F9F9F9"/><rect x="40" y="120" width="200" height="72" rx="6" fill="#e14817" stroke="#E14817" stroke-width="1" fill-opacity="0.08"/><text x="140.0" y="148.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PENDING</text><text x="140.0" y="164.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">outcome unknown</text><text x="140.0" y="178.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">or still running</text><rect x="520" y="48" width="200" height="56" rx="6" fill="#F9F9F9"/><rect x="520" y="48" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="620.0" y="75.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">SUCCESS</text><text x="620.0" y="91.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">terminal</text><rect x="520" y="208" width="200" height="56" rx="6" fill="#F9F9F9"/><rect x="520" y="208" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1"/><text x="620.0" y="235.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">FAILED</text><text x="620.0" y="251.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">terminal</text><text x="140" y="272" fill="#B63A10" font-size="11" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">technical failure:</text><text x="140" y="288" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">record the reason,</text><text x="140" y="304" fill="#5C5C5C" font-size="11" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">stay PENDING</text><rect x="300" y="296" width="180" height="92" rx="6" fill="#F9F9F9"/><rect x="300" y="296" width="180" height="92" rx="6" fill="#333333" stroke="#5C5C5C" stroke-width="1" fill-opacity="0.05"/><text x="390.0" y="327.0" fill="#333333" font-size="13" font-weight="600" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Detail codes</text><text x="390.0" y="343.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">PROVIDER_UNAVAILABLE</text><text x="390.0" y="357.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">..._AUTHENTICATION_FAILED</text><text x="390.0" y="371.0" fill="#5C5C5C" font-size="10" font-weight="400" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="middle">..._RESPONSE_INVALID</text><text x="620" y="300" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">Terminal is final:</text><text x="620" y="318" fill="#5C5C5C" font-size="12" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-style="italic">late events change nothing</text><line x1="16" y1="420" x2="744" y2="420" stroke="#333333" stroke-width="0.8" stroke-opacity="0.1"/><text x="16" y="442" fill="#5C5C5C" font-size="8" font-weight="500" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="103" y="431" width="22" height="14" rx="3" fill="#e14817" stroke="#E14817" fill-opacity="0.08"/><text x="136" y="442" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Retryable, non-terminal</text><line x1="299.70000000000005" y1="438" x2="327.70000000000005" y2="438" stroke="#5C5C5C" stroke-width="1.2" marker-end="url(#payment-state-policy-pstate-a)"/><text x="335.70000000000005" y="442" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Definitive provider outcome</text><line x1="523.0" y1="438" x2="551.0" y2="438" stroke="#E14817" stroke-width="1.2" marker-end="url(#payment-state-policy-pstate-ac)"/><text x="559.0" y="442" fill="#5C5C5C" font-size="11" font-weight="400" font-family="Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Timeout, 5xx, bad response</text>
</svg>
