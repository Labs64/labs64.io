<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" width="800" height="416" role="img" aria-labelledby="multi-psp-title multi-psp-desc"><title id="multi-psp-title">One API in front of several providers</title><desc id="multi-psp-desc">Applications call one Payment Gateway API; the gateway handles idempotency and tenant provider configuration and calls provider adapters through the provider SPI; webhooks return into one set of statuses.</desc><defs><marker id="multi-psp-ah-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="multi-psp-ah-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#E14817" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="multi-psp-ah-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#853E29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="416" fill="#F9F9F9"/><path d="M176,192 L264,192" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#multi-psp-ah-def)"/><path d="M488,144 L524.0,144.0 Q532,144 532.0,136.0 L532.0,96.0 Q532,88 540.0,88.0 L576,88" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#multi-psp-ah-def)"/><path d="M488,192 L576,192" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#multi-psp-ah-def)"/><path d="M488,240 L524.0,240.0 Q532,240 532.0,248.0 L532.0,288.0 Q532,296 540.0,296.0 L576,296" fill="none" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#multi-psp-ah-def)"/><path d="M376,336 L376,272" fill="none" stroke="#853E29" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#multi-psp-ah-link)"/><rect x="24" y="168" width="152" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="100.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Your apps</text><text x="100.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">shop, billing, jobs</text><rect x="264" y="112" width="224" height="160" rx="6" fill="#FBE3DA" stroke="#E14817" stroke-width="1.75"/><text x="376.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Payment Gateway</text><text x="376.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">idempotency, SPI, tenants</text><rect x="576" y="64" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="676.0" y="85.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Stripe adapter</text><text x="676.0" y="102.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">stripe</text><rect x="576" y="168" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="676.0" y="189.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">PayPal adapter</text><text x="676.0" y="206.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">paypal</text><rect x="576" y="272" width="200" height="48" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.25"/><text x="676.0" y="293.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">NoOp adapter</text><text x="676.0" y="310.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">tests</text><rect x="264" y="336" width="224" height="48" rx="6" fill="#EFEBE7" stroke="#6B6B6B" stroke-width="1.25" stroke-dasharray="5,4"/><text x="376.0" y="357.0" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333333" text-anchor="middle">Provider webhooks</text><text x="376.0" y="374.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6B6B" text-anchor="middle">/providers/{provider}/webhooks</text><rect x="190.4" y="170.0" width="59.2" height="16" fill="#F9F9F9"/><text x="220.0" y="181.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#6B6B6B" text-anchor="middle">REST API</text><rect x="384.0" y="297.0" width="59.2" height="16" fill="#F9F9F9"/><text x="388.0" y="308.0" font-family="'Roboto Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.06em" fill="#853E29" text-anchor="start">WEBHOOKS</text><text x="24" y="404" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B6B" text-anchor="start">The caller chooses the provider per payment (paymentProviderId); there is no automatic routing.</text></svg>